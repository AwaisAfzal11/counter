<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07100b" />
  <title>158 · Live Auto Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Header ===== -->
    <header class="card header" role="banner">
      <div class="header-left">
        <p class="eyebrow">
          <span class="live-badge"><span class="live-dot"></span>Live</span>
          Jul 27 &rarr; Dec 31 · 2026
        </p>
        <h1 class="progress">
          <span id="count" class="count">0</span><span class="slash"> / </span><span class="total">158</span>
        </h1>
        <p class="subtitle" id="subtitle">Days complete themselves. Sit back and watch.</p>
      </div>
      <div class="header-right">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle id="ringProgress" class="ring-fg" cx="60" cy="60" r="52" />
          </svg>
          <span id="percent" class="ring-label">0%</span>
        </div>
      </div>
    </header>

    <!-- ===== Live Status Bar (clock + countdown + % bar) ===== -->
    <section class="card status" aria-label="Live status">
      <div class="card-tag">Live · UTC+5</div>

      <div class="status-grid">
        <!-- Clock -->
        <div class="stat">
          <span class="stat-label">Local Time · UTC+5</span>
          <span id="clock" class="stat-value mono">00:00:00</span>
          <span id="clockDate" class="stat-sub">—</span>
        </div>

        <!-- Countdown to next auto-increment -->
        <div class="stat">
          <span class="stat-label">Next day fills in</span>
          <span id="countdown" class="stat-value mono accent">00:00:00</span>
          <span class="stat-sub">until midnight UTC+5</span>
        </div>

        <!-- Days remaining -->
        <div class="stat">
          <span class="stat-label">Cycle ends in</span>
          <span id="daysLeft" class="stat-value">—</span>
          <span class="stat-sub">days remaining</span>
        </div>
      </div>

      <!-- Percentage bar -->
      <div class="pct-block">
        <div class="pct-head">
          <span class="pct-caption">Progress</span>
          <span id="pctLabel" class="pct-value mono">0.0%</span>
        </div>
        <div class="pct-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pctTrack">
          <div id="pctFill" class="pct-fill"><span class="pct-shine"></span></div>
        </div>
      </div>
    </section>

    <!-- ===== Circular View (main focus) ===== -->
    <section class="card circular" aria-label="Circular view">
      <div class="card-tag">Cycle</div>
      <svg id="circleSvg" viewBox="0 0 500 500" class="circle-svg"></svg>
      <div class="circle-center">
        <span id="circleCount" class="circle-center-num">0</span>
        <span class="circle-center-sub">days done</span>
      </div>
    </section>

    <!-- ===== Calendar View (right) ===== -->
    <section class="card calendar" aria-label="Calendar view">
      <div class="card-tag">Months</div>
      <div id="calendar" class="calendar-grid"></div>
    </section>

    <!-- ===== Block View (bottom) ===== -->
    <section class="card blocks" aria-label="Block view">
      <div class="card-tag">All 158 days</div>
      <div id="blocks" class="blocks-grid"></div>
    </section>

  </div>

  <!-- celebratory burst layer (auto-triggered on rollover) -->
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <script src="script.js"></script>
</body>
</html>
