<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>158 · Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Header ===== -->
    <header class="card header" role="banner">
      <div class="header-left">
        <p class="eyebrow">Jul 27 &rarr; Dec 31 · 2026</p>
        <h1 class="progress">
          <span id="count" class="count">0</span><span class="slash"> / </span><span class="total">158</span>
        </h1>
        <p class="subtitle" id="subtitle">Every dot is a day. Fill them all.</p>
      </div>
      <div class="header-right">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle id="ringProgress" class="ring-fg" cx="60" cy="60" r="52" />
          </svg>
          <span id="percent" class="ring-label">0%</span>
        </div>
      </div>
    </header>

    <!-- ===== Circular View (main focus) ===== -->
    <section class="card circular" aria-label="Circular view">
      <div class="card-tag">Cycle</div>
      <svg id="circleSvg" viewBox="0 0 500 500" class="circle-svg"></svg>
      <div class="circle-center">
        <span id="circleCount" class="circle-center-num">0</span>
        <span class="circle-center-sub">days done</span>
      </div>
    </section>

    <!-- ===== Calendar View (right) ===== -->
    <section class="card calendar" aria-label="Calendar view">
      <div class="card-tag">Months</div>
      <div id="calendar" class="calendar-grid"></div>
    </section>

    <!-- ===== Block View (bottom) ===== -->
    <section class="card blocks" aria-label="Block view">
      <div class="card-tag">All 158 days</div>
      <div id="blocks" class="blocks-grid"></div>
    </section>

    <!-- <footer class="footer">
      <button id="resetBtn" class="reset" type="button">Reset progress</button>
    </footer> -->

  </div>

  <script src="script.js"></script>
</body>
</html>
